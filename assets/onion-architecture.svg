<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc"><title id="title">Onion Architecture</title><desc id="desc">Concentric layers Domain, Application, Infrastructure, Presentation, with dependencies directed inward.</desc><defs><radialGradient id="bg"><stop stop-color="#192437"/><stop offset="1" stop-color="#080c16"/></radialGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f3f5ff}.h{font-size:26px;font-weight:bold}.s{font-size:19px}.t{font-size:30px;font-weight:bold}</style></defs><rect width="1400" height="870" fill="url(#bg)"/><text x="48" y="78" font-size="56" font-weight="bold">Onion Architecture</text><rect x="48" y="98" width="100" height="5" rx="2" fill="#b078ff"/><text x="48" y="148" font-size="22" fill="#aeb9ce">Business logic at the center. Dependencies point inward.</text><circle cx="425" cy="505" r="325" fill="#06352e" stroke="#32dca3" stroke-width="4"/><circle cx="425" cy="505" r="260" fill="#073d40" stroke="#10caca" stroke-width="4"/><circle cx="425" cy="505" r="197" fill="#0a3d6f" stroke="#339aff" stroke-width="4"/><circle cx="425" cy="505" r="133" fill="#37215e" stroke="#b078ff" stroke-width="4"/><g text-anchor="middle"><text x="425" y="215" class="h">Presentation</text><text x="425" y="240" class="s">UI · API · Controllers</text><text x="425" y="297" class="h">Infrastructure</text><text x="425" y="324" class="s">DB · External Services</text><text x="425" y="362" class="h">Application</text><text x="425" y="389" class="s">Use Cases · Ports</text><text x="425" y="496" class="t">Domain</text><text x="425" y="525" class="s">Entities · Value Objects</text><text x="425" y="552" class="s">Business Rules</text></g><g transform="translate(810 172)"><rect width="540" height="118" rx="16" fill="#151429" stroke="#b078ff" stroke-width="2"/><text x="30" y="39" class="h">Domain (Core)</text><text x="30" y="72" class="s">Business concepts and invariants.</text><text x="30" y="99" class="s">Independent of frameworks.</text><rect y="138" width="540" height="118" rx="16" fill="#0c2038" stroke="#339aff" stroke-width="2"/><text x="30" y="177" class="h">Application</text><text x="30" y="210" class="s">Coordinates use cases and domain.</text><text x="30" y="237" class="s">Defines required interfaces (ports).</text><rect y="276" width="540" height="118" rx="16" fill="#082a32" stroke="#10caca" stroke-width="2"/><text x="30" y="315" class="h">Infrastructure</text><text x="30" y="348" class="s">Implements persistence and integrations.</text><text x="30" y="375" class="s">Depends on inner abstractions.</text><rect y="414" width="540" height="118" rx="16" fill="#0a302d" stroke="#32dca3" stroke-width="2"/><text x="30" y="453" class="h">Presentation</text><text x="30" y="486" class="s">Receives requests and presents results.</text><text x="30" y="513" class="s">Invokes application use cases.</text><text y="598" class="h">Key rules</text><text x="6" y="641" class="s">✓ Source-code dependencies go inward</text><text x="6" y="681" class="s">✓ Business rules stay isolated and testable</text></g></svg>